<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6d43c7">
  <title>Email verified · eCuisine BMS</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#f8f5ff,#eee8ff);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#211b31}.card{width:min(100%,480px);padding:42px 30px;background:#fff;border:1px solid #eee8f7;border-radius:28px;box-shadow:0 24px 80px #3c24601a;text-align:center}.mark{width:64px;height:64px;margin:0 auto 22px;border-radius:22px;display:grid;place-items:center;background:#f0eaff;color:#7046c8;font-size:30px}.eyebrow{font-size:11px;letter-spacing:.16em;font-weight:800;color:#7957bc}.check{width:58px;height:58px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:#e8f8ef;color:#18864b;font-size:28px}h1{font-size:28px;line-height:1.15;margin:0 0 12px;letter-spacing:-.04em}p{color:#756e81;line-height:1.65;margin:0 0 26px}.btn{display:block;text-decoration:none;background:#7046c8;color:white;font-weight:700;padding:15px 20px;border-radius:14px}.hint{font-size:12px;margin-top:18px;color:#91899e}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">✦</div>
    <div class="eyebrow">ECUISINE BUSINESS MANAGEMENT</div>
    <div class="check">✓</div>
    <h1>Email verified successfully</h1>
    <p>Your email address has been confirmed. You can now return to eCuisine BMS and sign in with your email and password.</p>
    <a class="btn" href="https://dubemascend-png.github.io/ecuisine-business-management-system/">Return to eCuisine BMS</a>
    <div class="hint">You can safely close this page after returning to the app.</div>
  </main>
</body>
</html>
